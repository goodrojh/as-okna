<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4A6B"/>
      <stop offset="1" stop-color="#0B1620"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC56B"/>
      <stop offset="1" stop-color="#F2A33A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- warm light in the right sash -->
  <rect x="33.6" y="14.6" width="13.8" height="27.8" rx="1.6" fill="url(#glow)"/>
  <!-- frame + mullion -->
  <rect x="14" y="13" width="36" height="31" rx="4" fill="none" stroke="#fff" stroke-width="3.2"/>
  <line x1="32" y1="14.5" x2="32" y2="42.5" stroke="#fff" stroke-width="3.2"/>
  <!-- glass glints on the left pane -->
  <path d="M18.5 22 L24 16.5" stroke="#9CC4DD" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M18.5 28 L26.5 20" stroke="#9CC4DD" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
  <!-- window handle on the sash -->
  <rect x="35.4" y="24" width="3" height="8.5" rx="1.5" fill="#0B1620"/>
  <!-- windowsill -->
  <rect x="10" y="47.5" width="44" height="4.2" rx="2.1" fill="#fff"/>
</svg>
